plugins {
    id 'java-library'
    id 'me.champeau.jmh' version '0.7.2'
}

group = 'gloomlib'
version = project.parent.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Paper API（包含 Adventure API）
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    
    // Adventure API 显式声明（Paper 已包含，这里明确版本）
    compileOnly 'net.kyori:adventure-api:4.18.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.18.0'
    
    // 测试依赖
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    
    // JMH 依赖
    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmh 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.named('test') {
    useJUnitPlatform()
}

// JMH 配置
jmh {
    warmupIterations = project.hasProperty('jmh.warmupIterations') ? project.property('jmh.warmupIterations') as int : 5
    iterations = project.hasProperty('jmh.measurementIterations') ? project.property('jmh.measurementIterations') as int : 10
    fork = project.hasProperty('jmh.fork') ? project.property('jmh.fork') as int : 1
    threads = 1
    
    // 支持通过参数指定要运行的基准测试
    if (project.hasProperty('jmh.includes')) {
        includes = [project.property('jmh.includes') as String]
    }
    
    resultFormat = 'JSON'
    resultsFile = project.file("${project.buildDir}/reports/jmh/results.json")
    humanOutputFile = project.file("${project.buildDir}/reports/jmh/results.txt")
}

// 启用参数名保留（用于自动参数名获取）
compileJava {
    options.compilerArgs += ['-parameters']
}

// JavaDoc 配置
tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}
