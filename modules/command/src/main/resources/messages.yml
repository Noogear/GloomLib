# GloomLib Command Framework Messages Configuration
# All messages use MiniMessage format: https://docs.advntr.dev/minimessage/format.html

# Help system messages
command:
  help:
    no_commands: "<gray>No commands available.</gray>"
    header: "<gold><bold>{0} {1} HELP {0}</bold></gold>"
    separator: "<gold>{0}</gold>"
    usage_prefix: "<dark_gray>  ▸ </dark_gray>"
    desc_prefix: "<gray>     ↳ {0}</gray>"
    no_desc: "No description"
    hover:
      command: "<gold>Command: </gold><white>{0}</white>"
      description: "<gold>Description: </gold><gray>{0}</gray>"
      click: "<aqua><italic>✦ Click to fill command</italic></aqua>"
    page_info: "<yellow>Page {0}/{1}</yellow>"
    prev_button: "<green><bold>[← Prev]</bold></green>"
    next_button: "<green><bold>[Next →]</bold></green>"
    prev_disabled: "<dark_gray>[← Prev]</dark_gray>"
    next_disabled: "<dark_gray>[Next →]</dark_gray>"
    goto_page: "Go to page {0}"
    page_separator: "<dark_gray>  |  </dark_gray>"

  # Validation error messages
  validation:
    empty: "<red>Argument {0} cannot be empty!</red>"
    null: "<red>Argument {0} cannot be null!</red>"
    length_min: "<red>Argument {0} min length: {1}</red>"
    length_max: "<red>Argument {0} max length: {1}</red>"
    enum_invalid: "<red>Invalid value '<white>{0}</white>'. Allowed: <yellow>{1}</yellow></red>"
    duration:
      empty: "<red>Duration cannot be empty!</red>"
      invalid: "<red>Invalid duration: <white>{0}</white> (e.g. 1d2h30m)</red>"
      positive: "<red>Duration must be greater than 0!</red>"

  # Cooldown messages
  cooldown:
    wait: "<red>Please wait <yellow>{0}</yellow>!</red>"

# Examples of advanced MiniMessage formatting:
# Gradients: "<gradient:red:blue>Text</gradient>"
# Rainbow: "<rainbow:!>Text</rainbow>"
# Hover: "<hover:show_text:'Tooltip'>Text</hover>"
# Click: "<click:run_command:/command>Text</click>"
